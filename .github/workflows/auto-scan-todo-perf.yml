name: Auto Scan TODO and Performance Optimization
on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scan-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Run Auto Optimization Script
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          python .github/scripts/auto_optimize.py

      - name: Build client to verify
        run: |
          cd forza-telemetry/client
          npm install
          npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: auto resolve TODOs and optimize performance"
          title: "Auto-scan: Resolve TODOs and Optimize Performance"
          body: "This PR is auto-generated by the weekly scan workflow to address TODOs and performance optimization points using DashScope Qwen model."
          branch: "auto-optimize-branch"
          base: "main"

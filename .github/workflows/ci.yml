name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: forza-telemetry
        run: npm run install:all
      - name: Run tests and build
        working-directory: forza-telemetry
        run: npm run verify
